[workspace]
resolver = "3"
members = ["crates/mc-core", "crates/mc-py"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "LicenseRef-MineCore-Proprietary"
publish = false
authors = ["MineCore"]

[workspace.dependencies]
mc-core = { path = "crates/mc-core" }
pyo3 = { version = "0.30", features = ["abi3-py312"] }
thiserror = "2.0"
proptest = "1.12"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
